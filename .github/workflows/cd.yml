name: Android CD

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cd-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-cd-${{ runner.os }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDYBUDDY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret STUDYBUDDY_KEYSTORE_BASE64; no se publica una release sin firma oficial."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STUDYBUDDY_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          STUDYBUDDY_KEYSTORE_PASSWORD: ${{ secrets.STUDYBUDDY_KEYSTORE_PASSWORD }}
          STUDYBUDDY_KEY_ALIAS: ${{ secrets.STUDYBUDDY_KEY_ALIAS }}
          STUDYBUDDY_KEY_PASSWORD: ${{ secrets.STUDYBUDDY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true